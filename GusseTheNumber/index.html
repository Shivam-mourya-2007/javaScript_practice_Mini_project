<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    html {
  font-family: sans-serif;
}

body {
  width: 100%;
  max-width: 800px;
  min-width: 480px;
  margin: 0 auto;
  background-color: #212121;
  color: #fff;
}

#wrapper {
  box-sizing: border-box;
  width: 450px;
  height: 550px;
  background-color: #474747;
  margin: 40px auto;
  border-radius: 5px;
  text-align: center;
  padding-top: 20px;
}

h1 {
  font-size: 2.5rem;
  text-align: center;
  color: #fff;
}

p {
  font-size: 1.1rem;
  text-align: center;
  color: #fff;
}

.form {
  margin-top: 40px;
}

.guessField {
  width: 250px;
  height: 40px;
  font-size: 20px;
  background-color: #fff;
  border: none;
  border-radius: 4px;
  margin-bottom: 20px;
  text-align: center;
}

.guessSubmit {
  background-color: #161616;
  color: #fff;
  border: none;
  font-size: 1.2rem;
  padding: 10px 20px;
  border-radius: 4px;
  cursor: pointer;
  display: block;
  margin: 0 auto;
}

.guessSubmit:hover {
  background-color: #2c2c2c;
}

.resultParas {
  margin-top: 30px;
  font-size: 1.2rem;
}   
</style>
<body>
    <div id="wrapper">
      <h1>Number guessing game</h1>
      <p>Try and guess a random number between 1 and 100.</p>
      <p>You have 10 attempts to guess the right number.</p>
      <br>
      <form class="form">
        <label2 for="guessField" id="guess">Guess a number</label2>
        <input type="text" id="guessField" class="guessField">
        <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
      </form>

      <div class="resultParas">
        <p>Previous Guesses: <span class="guesses"></span></p>
        <p>Guesses Remaining: <span class="lastResult">10</span></p>
        <p class="lowOrHi"></p>
      </div>
    </div>
</body>
</html>
